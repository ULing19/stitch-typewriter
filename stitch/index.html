<body>
<canvas id="stage"></canvas>
<textarea id="keys" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="文字刺绣小工具输入"></textarea>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="wob" x="-20%" y="-20%" width="140%" height="140%"><feTurbulence type="fractalNoise" baseFrequency=".06" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="1.8"/></filter>
  <filter id="rough" x="-20%" y="-20%" width="140%" height="140%"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" seed="5"/><feDisplacementMap in="SourceGraphic" scale="2.2"/></filter>

  <filter id="sticker" x="-30%" y="-30%" width="160%" height="160%">
    <feMorphology in="SourceAlpha" operator="dilate" radius="3.6" result="fat"/>
    <feTurbulence type="fractalNoise" baseFrequency=".09" numOctaves="1" seed="11" result="noise"/>
    <feDisplacementMap in="fat" in2="noise" scale="7" xChannelSelector="R" yChannelSelector="G" result="torn"/>
    <feFlood flood-color="#fffaf4" result="white"/>
    <feComposite in="white" in2="torn" operator="in" result="paper"/>
    <feOffset in="torn" dx=".4" dy="1.2" result="off"/>
    <feGaussianBlur in="off" stdDeviation=".9" result="blur"/>
    <feColorMatrix in="blur" type="matrix" values="0 0 0 0 .35  0 0 0 0 .2  0 0 0 0 .18  0 0 0 .22 0" result="shadow"/>
    <feMerge><feMergeNode in="shadow"/><feMergeNode in="paper"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</svg>

<div id="bar">
  <div class="group">
    <button class="tool" data-open="yarn" id="spoolBtn" title="绣线" style="--c:#f3a6b6">
      <svg viewBox="0 0 48 48"><g transform="rotate(-10 24 24)">
        <rect class="f" x="15" y="12" width="18" height="24"/><rect x="15" y="12" width="18" height="24" rx="1"/>
        <path d="M12 9h24M12 39h24"/><path d="M16 17c6-1 10 1 16-1M16 23c6-1 10 1 16-1M16 29c6-1 10 1 16-1"/><path d="M33 34c4 3 5 6 4 9"/>
      </g></svg><span data-t="tool.yarn">绣线</span>
    </button>
    <button class="tool" data-open="font" title="字体" style="--c:#c9d6ea">
      <svg viewBox="0 0 48 48"><g transform="rotate(-4 24 24)">
        <rect class="f" x="9" y="9" width="30" height="30" rx="7"/><rect x="9" y="9" width="30" height="30" rx="7"/>
        <path d="M18 31l6-15 6 15M20.3 26h7.4"/>
      </g></svg><span data-t="tool.font">字体</span>
    </button>
    <button class="tool" data-open="motif" title="图案" style="--c:#f3c9d8">
